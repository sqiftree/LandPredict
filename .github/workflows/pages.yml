name: Deploy LandPredict Atlas

on:
  push:
    branches: [main]
    paths:
      - 'web/landpredict/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check_web_export.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static export
        run: |
          python3 scripts/check_web_export.py
          node --check web/landpredict/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload map website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/landpredict
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
